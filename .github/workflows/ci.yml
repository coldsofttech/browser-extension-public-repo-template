name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: pre-commit/action@v3.0.1
        env:
          SKIP: vitest # covered by the test job across all Node.js versions

  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node-version: ["22", "24"]
        include:
          - os: windows-latest
            node-version: "22"
          - os: macos-latest
            node-version: "22"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm test

  # Loads the built extension into a real Chromium, which covers Chrome and Edge too.
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:integration

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run package
      - name: Lint the Firefox build
        run: npm run lint:ext
      - uses: actions/upload-artifact@v7
        with:
          name: extension-packages
          path: artifacts/*.zip
          retention-days: 7

  # Single required status check for the branch ruleset.
  ci:
    if: always()
    needs: [lint, test, integration, build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check results
        run: |
          echo "lint:        ${{ needs.lint.result }}"
          echo "test:        ${{ needs.test.result }}"
          echo "integration: ${{ needs.integration.result }}"
          echo "build:       ${{ needs.build.result }}"
          [ "${{ needs.lint.result }}" = success ] &&
          [ "${{ needs.test.result }}" = success ] &&
          [ "${{ needs.integration.result }}" = success ] &&
          [ "${{ needs.build.result }}" = success ]
